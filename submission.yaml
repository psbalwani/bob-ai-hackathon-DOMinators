submission:
  title: "ClinIQ"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Major clinical trials run 5,000+ patient visits across 200+ sites, making
    it impossible for risk managers to manually catch protocol deviations —
    missed visits, wrong dosing, banned co-medications — before an FDA audit.
    A single rejected submission delays drug approval by 6-12 months and
    costs $50-100M, yet today's calendar-driven monitoring gives no real-time
    visibility into which sites are highest risk.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    ClinIQ is a Bob-orchestrated multi-agent pipeline that compares patient
    records against the protocol specification to detect deviations,
    classifies each by severity under ICH E6 GCP (major/minor/administrative),
    scores site-level risk from leading indicators, and generates CAPA-ready
    mitigation reports for a risk manager to review before they're finalized.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Protocol spec parser that extracts visit windows, dosing rules, and banned co-medications into structured constraints"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Deviation detection agent that diffs patient visit records against those constraints in near real time"
    - "ICH E6 GCP severity classifier (major/minor/administrative) for every detected deviation"
    - "Site-level risk scoring engine combining deviation history with leading indicators (enrollment velocity, deviation trend)"                               # optional 4th
    - "CAPA-ready report generator with recommended corrective/preventive actions, plus a human-in-the-loop review gate"                               # optional 5th

  tech_stack:
    languages: ["Python", "TypeScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Docker"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The multi-agent handoff — deviation detection, severity classification,
    risk scoring, and CAPA drafting run as distinct Bob-orchestrated agents
    with a human review checkpoint before anything is finalized, mirroring
    how a real GCP compliance workflow would need audit-grade traceability.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Built and tested against a synthetic patient/protocol dataset rather than
    a real EDC feed. Severity classification currently relies on rule-based
    logic mapped to ICH E6(R2)-era deviation categories rather than a
    fully validated GCP taxonomy, and site risk scoring uses a limited set
    of leading indicators due to hackathon time constraints.

